name: wanwu-sound
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}
x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging: *logging
services:
  database:
    <<: *hardening
    image: postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    user: "999:999"
    env_file: .env.database
    volumes: [database:/var/lib/postgresql/data]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=16m,mode=1777", "/var/run/postgresql:rw,nosuid,noexec,size=1m,uid=999,gid=999"]
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20]
    networks: [database]
    cpus: 0.25
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    healthcheck: {test: [CMD-SHELL, "pg_isready -U wanwu_owner -d wanwu_sound"], interval: 10s, timeout: 3s, retries: 10}
  api:
    <<: *hardening
    image: ${WANWU_API_IMAGE:?Set a verified digest-pinned Wanwu API image}
    user: "1000:1000"
    env_file: .env.api
    environment: {WANWU_API_HOST: 0.0.0.0, WANWU_API_PORT: "3100", WANWU_SOURCE_DIGEST: "${WANWU_SOURCE_DIGEST:?Set the release source digest}"}
    ports: ["127.0.0.1:3100:3100"]
    networks: [database, egress]
    depends_on: {database: {condition: service_healthy}}
    tmpfs: ["/tmp:rw,nosuid,noexec,size=16m,mode=1777"]
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    healthcheck: {test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s, timeout: 5s, retries: 3}
  media:
    <<: *hardening
    image: ${WANWU_WORKER_IMAGE:?Set a verified digest-pinned Wanwu worker image}
    user: "1000:1000"
    env_file: .env.worker
    environment: {WANWU_RENDERER_IMAGE: "${WANWU_WORKER_IMAGE}", WANWU_SOURCE_DIGEST: "${WANWU_SOURCE_DIGEST}"}
    networks: [database, egress]
    depends_on: {database: {condition: service_healthy}}
    volumes: [media-scratch:/var/lib/wanwu-media]
    security_opt: [no-new-privileges:true, "seccomp=./seccomp-profile.json"]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=256m,mode=1777", "/home/node:rw,nosuid,noexec,size=32m,uid=1000,gid=1000"]
    shm_size: 128m
    cpus: 0.5
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    stop_grace_period: 35s
  ops:
    <<: *hardening
    profiles: [management]
    image: ${WANWU_OPS_IMAGE:?Set a verified Wanwu ops image}
    restart: "no"
    user: "1000:1000"
    env_file: .env.ops
    volumes: [./backup-public.pem:/run/wanwu/backup-public.pem:ro]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=128m,mode=1777"]
    networks: [database, egress]
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
  catalogue:
    <<: *hardening
    profiles: [management]
    image: ${WANWU_CATALOGUE_IMAGE:?Set a verified Wanwu catalogue seed image}
    restart: "no"
    user: "1000:1000"
    env_file: .env.ops
    tmpfs: ["/tmp:rw,nosuid,noexec,size=32m,mode=1777"]
    networks: [database, egress]
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
networks:
  database: {internal: true}
  egress: {}
volumes:
  database: {}
  media-scratch: {}
